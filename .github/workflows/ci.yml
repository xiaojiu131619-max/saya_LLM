name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — cargo check + test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            app/src-tauri/target/
            ~/.cargo/registry/
            ~/.cargo/git/
          key: cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend — npm build + lint
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        run: npm ci --ignore-scripts
      - name: npm run build
        run: npm run build
      - name: npm run lint
        run: npm run lint
